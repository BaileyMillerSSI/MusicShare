name: Ops security report

on:
  workflow_dispatch:
# Weekly activation requires separate approval; proposed cadence: Mondays 08:00 UTC.
# schedule:
#   - cron: '0 8 * * 1'

permissions:
  contents: read

jobs:
  report:
    if: github.repository == 'BaileyMillerSSI/MusicShare'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCANNED_SHA: ${{ github.sha }}
      SEMGREP_SEND_METRICS: 'off'
      SEMGREP_ENABLE_VERSION_CHECK: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: MusicShare.Frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm --prefix MusicShare.Frontend ci --ignore-scripts --no-audit
      - run: dotnet restore MusicShare.slnx -p:NuGetAudit=false
      - name: Install pinned community scanner
        run: python -m pip install --disable-pip-version-check 'semgrep==1.182.0'
      - name: Collect established dependency and static results
        shell: bash
        run: |
          mkdir -p .private/security
          npm --version > .private/security/npm.version
          dotnet --version > .private/security/dotnet.version
          set +e
          npm --prefix MusicShare.Frontend audit --json > .private/security/audit.json
          echo "$?" > .private/security/audit.exit
          dotnet package list --project MusicShare.slnx --no-restore --vulnerable --include-transitive --format json --output-version 1 > .private/security/dotnet.json
          echo "$?" > .private/security/dotnet.exit
          semgrep scan --metrics=off --disable-version-check --config https://raw.githubusercontent.com/semgrep/semgrep-rules/16b9e6d45f10649f6a531ec4838ed9924372c3bc/javascript/lang/security/detect-eval-with-expression.yaml --config https://raw.githubusercontent.com/semgrep/semgrep-rules/16b9e6d45f10649f6a531ec4838ed9924372c3bc/javascript/lang/security/detect-insecure-websocket.yaml --error --json-output .private/security/semgrep.json MusicShare.Frontend/src
          echo "$?" > .private/security/semgrep.exit
          set -e
          node scripts/ops-security-report.mjs .private/security
      - uses: actions/upload-artifact@v4
        with:
          name: ops-security-${{ github.sha }}
          path: .private/security/security-summary.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Fail on findings or incomplete coverage
        run: |
          node --input-type=module - <<'JS'
          import {readFile} from 'node:fs/promises';
          const report=JSON.parse(await readFile('.private/security/security-summary.json','utf8'));
          if(report.tools.some(scan=>scan.status!=='completed'||Object.values(scan.counts||{}).some(n=>n>0))) process.exit(1);
          JS
