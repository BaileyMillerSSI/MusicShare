name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Required for azure-dev.yml to authenticate with Azure
permissions:
  id-token: write
  contents: read

jobs:
  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MusicShare.Frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: MusicShare.Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore MusicShare.slnx

      - name: Build
        run: dotnet build MusicShare.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test MusicShare.slnx --no-build --configuration Release --verbosity normal

  # CD steps - only run on push or manual trigger, not on PRs
  deploy:
    name: Deploy
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'develop' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install .NET Aspire workload
        run: dotnet workload install aspire

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Log in with Azure Developer CLI
        run: |
          azd auth login \
            --client-id ${{ secrets.AZURE_CLIENT_ID }} \
            --client-secret ${{ secrets.AZURE_CLIENT_SECRET }} \
            --tenant-id ${{ secrets.AZURE_TENANT_ID }}

      - name: Provision and Deploy
        run: |
          azd env select ${{ vars.AZURE_ENV_NAME }} 2>/dev/null || azd env new ${{ vars.AZURE_ENV_NAME }} --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }} --location ${{ vars.AZURE_LOCATION }}
          azd env set AZURE_RESOURCE_GROUP ${{ vars.RESOURCE_GROUP }}

          # Set RabbitMQ credentials (required by AppHost parameters)
          azd env set RABBITMQ_USERNAME "${{ secrets.RABBITMQ_USERNAME }}"
          azd env set RABBITMQ_PASSWORD "${{ secrets.RABBITMQ_PASSWORD }}"

          # Set Spotify credentials (required by AppHost parameters)
          azd env set SPOTIFY__CLIENTID "${{ secrets.SPOTIFY_CLIENTID }}"
          azd env set SPOTIFY__CLIENTSECRET "${{ secrets.SPOTIFY_CLIENTSECRET }}"

          # Set YouTube settings
          azd env set YOUTUBE__GEOGRAPHICLOCATION "${{ vars.YOUTUBE_GEOGRAPHICLOCATION }}"

          # Deploy
          azd up --no-prompt
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}

      - name: Output deployment info
        run: |
          echo "Deployment completed to ${{ github.ref == 'refs/heads/main' && 'production' || 'develop' }} environment"
          azd show
