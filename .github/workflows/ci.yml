name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Required for azure-dev.yml to authenticate with Azure
permissions:
  id-token: write
  contents: read

jobs:
  frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MusicShare.Frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: MusicShare.Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore MusicShare.slnx

      - name: Build
        run: dotnet build MusicShare.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test MusicShare.slnx --no-build --configuration Release --verbosity normal
        env:
          MUSICSHARE_TEST_MONGODB: mongodb://127.0.0.1:27017

  # Production deploys only run from main, never from pull requests or feature branches.
  deploy:
    name: Deploy
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install .NET Aspire workload
        run: dotnet workload install aspire

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Log in with Azure Developer CLI
        run: |
          azd auth login \
            --client-id ${{ secrets.AZURE_CLIENT_ID }} \
            --client-secret ${{ secrets.AZURE_CLIENT_SECRET }} \
            --tenant-id ${{ secrets.AZURE_TENANT_ID }}

      - name: Provision Infrastructure
        run: azd provision --no-prompt
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          AZURE_MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
          AZURE_RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          AZURE_RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          AZURE_SPOTIFY_CLIENTID: ${{ secrets.SPOTIFY_CLIENTID }}
          AZURE_SPOTIFY_CLIENTSECRET: ${{ secrets.SPOTIFY_CLIENTSECRET }}
          AZURE_YOUTUBE_GEOGRAPHICLOCATION: ${{ vars.YOUTUBE_GEOGRAPHICLOCATION }}
          AZURE_REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
          AZURE_MAINTENANCE_SECRET: ${{ secrets.MAINTENANCE_SECRET }}
          AZURE_FRONTEND_ORIGIN: https://${{ vars.sub_domain }}.${{ vars.domain }}
          AZURE_RESUME_ORIGIN: https://resume.baileymiller.dev
          AZURE_CUSTOM_DOMAIN: ${{ vars.sub_domain }}.${{ vars.domain }}
          AZURE_CERTIFICATE_NAME: "${{ vars.certificate_name }}"
          AZURE_API_MIN_REPLICAS: ${{ vars.API_MIN_REPLICAS }}
          AZURE_API_MAX_REPLICAS: ${{ vars.API_MAX_REPLICAS }}
          AZURE_FRONTEND_MIN_REPLICAS: ${{ vars.FRONTEND_MIN_REPLICAS }}
          AZURE_FRONTEND_MAX_REPLICAS: ${{ vars.FRONTEND_MAX_REPLICAS }}
          AZURE_MONGODB: ${{ secrets.MONGODB_URI }}
          AZURE_RABBITMQ: ${{ secrets.RABBITMQ_URL }}

      - name: Deploy Application
        run: azd deploy --no-prompt
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          AZURE_MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
          AZURE_RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          AZURE_RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          AZURE_SPOTIFY_CLIENTID: ${{ secrets.SPOTIFY_CLIENTID }}
          AZURE_SPOTIFY_CLIENTSECRET: ${{ secrets.SPOTIFY_CLIENTSECRET }}
          AZURE_YOUTUBE_GEOGRAPHICLOCATION: ${{ vars.YOUTUBE_GEOGRAPHICLOCATION }}
          AZURE_REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
          AZURE_MAINTENANCE_SECRET: ${{ secrets.MAINTENANCE_SECRET }}
          AZURE_FRONTEND_ORIGIN: https://${{ vars.sub_domain }}.${{ vars.domain }}
          AZURE_RESUME_ORIGIN: https://resume.baileymiller.dev
          AZURE_CUSTOM_DOMAIN: ${{ vars.sub_domain }}.${{ vars.domain }}
          AZURE_CERTIFICATE_NAME: "${{ vars.certificate_name }}"
          AZURE_API_MIN_REPLICAS: ${{ vars.API_MIN_REPLICAS }}
          AZURE_API_MAX_REPLICAS: ${{ vars.API_MAX_REPLICAS }}
          AZURE_FRONTEND_MIN_REPLICAS: ${{ vars.FRONTEND_MIN_REPLICAS }}
          AZURE_FRONTEND_MAX_REPLICAS: ${{ vars.FRONTEND_MAX_REPLICAS }}
          AZURE_MONGODB: ${{ secrets.MONGODB_URI }}
          AZURE_RABBITMQ: ${{ secrets.RABBITMQ_URL }}

      - name: Output deployment info
        run: |
          echo "Deployment completed to production environment"
          azd show
