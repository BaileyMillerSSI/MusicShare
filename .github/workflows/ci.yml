name: CI

on:
  push:
    branches: [main, 'feature/**', 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Required for azure-dev.yml to authenticate with Azure
permissions:
  id-token: write
  contents: read

jobs:
  frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MusicShare.Frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: MusicShare.Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore MusicShare.slnx

      - name: Build
        run: dotnet build MusicShare.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test MusicShare.slnx --no-build --configuration Release --verbosity normal

  # CD steps - only run on push or manual trigger, not on PRs
  deploy:
    name: Deploy
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'develop' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install .NET Aspire workload
        run: dotnet workload install aspire

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Log in with Azure Developer CLI
        run: |
          azd auth login \
            --client-id ${{ secrets.AZURE_CLIENT_ID }} \
            --client-secret ${{ secrets.AZURE_CLIENT_SECRET }} \
            --tenant-id ${{ secrets.AZURE_TENANT_ID }}

      - name: Provision Infrastructure
        run: azd provision --no-prompt
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          AZURE_MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
          AZURE_RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          AZURE_RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          AZURE_SPOTIFY_CLIENTID: ${{ secrets.SPOTIFY_CLIENTID }}
          AZURE_SPOTIFY_CLIENTSECRET: ${{ secrets.SPOTIFY_CLIENTSECRET }}
          AZURE_YOUTUBE_GEOGRAPHICLOCATION: ${{ vars.YOUTUBE_GEOGRAPHICLOCATION }}
          AZURE_REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
          AZURE_CUSTOM_DOMAIN: ${{ vars.sub_domain }}.${{ vars.domain }}
          AZURE_CERTIFICATE_NAME: "${{ vars.certificate_name }}"
          AZURE_API_MIN_REPLICAS: ${{ vars.API_MIN_REPLICAS }}
          AZURE_API_MAX_REPLICAS: ${{ vars.API_MAX_REPLICAS }}
          AZURE_FRONTEND_MIN_REPLICAS: ${{ vars.FRONTEND_MIN_REPLICAS }}
          AZURE_FRONTEND_MAX_REPLICAS: ${{ vars.FRONTEND_MAX_REPLICAS }}

      - name: Deploy Application
        run: azd deploy --no-prompt
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          AZURE_MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
          AZURE_RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          AZURE_RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          AZURE_SPOTIFY_CLIENTID: ${{ secrets.SPOTIFY_CLIENTID }}
          AZURE_SPOTIFY_CLIENTSECRET: ${{ secrets.SPOTIFY_CLIENTSECRET }}
          AZURE_YOUTUBE_GEOGRAPHICLOCATION: ${{ vars.YOUTUBE_GEOGRAPHICLOCATION }}
          AZURE_REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
          AZURE_CUSTOM_DOMAIN: ${{ vars.sub_domain }}.${{ vars.domain }}
          AZURE_CERTIFICATE_NAME: "${{ vars.certificate_name }}"
          AZURE_API_MIN_REPLICAS: ${{ vars.API_MIN_REPLICAS }}
          AZURE_API_MAX_REPLICAS: ${{ vars.API_MAX_REPLICAS }}
          AZURE_FRONTEND_MIN_REPLICAS: ${{ vars.FRONTEND_MIN_REPLICAS }}
          AZURE_FRONTEND_MAX_REPLICAS: ${{ vars.FRONTEND_MAX_REPLICAS }}

      - name: Output deployment info
        run: |
          echo "Deployment completed to ${{ github.ref == 'refs/heads/main' && 'production' || 'develop' }} environment"
          azd show

  warm-cache:
    name: Warm ISR Cache
    needs: [deploy]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'develop' }}

    steps:
      - name: Warm ISR cache
        run: |
          FRONTEND_URL="https://${{ vars.sub_domain }}.${{ vars.domain }}"
          echo "Warming ISR cache at ${FRONTEND_URL}/api/revalidate-all ..."

          MAX_RETRIES=3
          RETRY_DELAY=15

          for i in $(seq 1 $MAX_RETRIES); do
            STATUS=$(curl -s -o /tmp/revalidate-response.json -w "%{http_code}" \
              -X POST "${FRONTEND_URL}/api/revalidate-all" \
              -H "X-API-KEY: ${{ secrets.REVALIDATION_SECRET }}" \
              -H "Content-Type: application/json")

            if [ "$STATUS" = "200" ]; then
              echo "Cache warming succeeded (attempt ${i}/${MAX_RETRIES}):"
              cat /tmp/revalidate-response.json
              echo ""
              COUNT=$(cat /tmp/revalidate-response.json | python3 -c "import sys,json; print(json.load(sys.stdin).get('count',0))" 2>/dev/null || echo "unknown")
              echo "Warmed ${COUNT} ISR routes."
              break
            else
              echo "Attempt ${i}/${MAX_RETRIES} failed with status ${STATUS}."
              cat /tmp/revalidate-response.json 2>/dev/null || true
              echo ""
              if [ "$i" -lt "$MAX_RETRIES" ]; then
                echo "Retrying in ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
              else
                echo "::warning::ISR cache warming failed after ${MAX_RETRIES} attempts (status: ${STATUS}). The cache will be populated on first request."
              fi
            fi
          done
