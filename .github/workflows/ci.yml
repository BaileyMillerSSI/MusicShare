name: CI

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

# Required for azure-dev.yml to authenticate with Azure
permissions:
  id-token: write
  contents: read

jobs:
  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MusicShare.Frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: MusicShare.Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore MusicShare.slnx

      - name: Build
        run: dotnet build MusicShare.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test MusicShare.slnx --no-build --configuration Release --verbosity normal

  deploy-staging:
    name: Deploy to Staging
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/azure-dev.yml
    with:
      environment: staging
    secrets: inherit

  deploy-production:
    name: Deploy to Production
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/azure-dev.yml
    with:
      environment: production
    secrets: inherit
